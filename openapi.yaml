    get:
      operationId: listGameChanges
      tags: [Changes]
      summary: Read a game's change stream
      description: |
        The same changes the WebSocket stream `game:<id>` carries, after a seq, oldest first.
        Poll it with the last seq you applied. A game's stream stays readable for at least 7 days
        after the game ends; after that, or when `after_seq` is older than what is retained,
        it returns 410 with code `resync_required`, and the client fetches the game again.
      parameters:
        - {$ref: "#/components/parameters/League"}
        - {$ref: "#/components/parameters/GameID"}
        - name: after_seq
          in: query
          required: true
          description: The last seq the client applied, or 0 for the start.
          schema: {$ref: "#/components/schemas/Seq"}
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
