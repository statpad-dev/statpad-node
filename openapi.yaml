        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/{league}/transactions:
    get:
      operationId: listTransactions
      tags: [League news]
      summary: List transactions
      description: Transactions announced at or after `since`, oldest first.
      parameters:
        - {$ref: "#/components/parameters/League"}
        - name: since
          in: query
          required: true
          schema: {type: string, format: date-time}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of transactions with their players.
          headers:
            RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
            RateLimit: {$ref: "#/components/headers/RateLimit"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/{league}/seasons/{year}/{season_type}/leaders:
    get:
      operationId: listLeaders
      tags: [Statistics]
      summary: List season leaders for a stat
      description: |
        Players ranked by one stat of their season totals across teams. Ties are broken by player
        id, so pages are stable.
      parameters:
        - {$ref: "#/components/parameters/League"}
        - name: year
          in: path
          required: true
          schema: {type: integer, format: int32}
          example: 2026
        - name: season_type
          in: path
          required: true
          schema: {$ref: "#/components/schemas/SeasonType"}
        - name: category
          in: query
          required: true
          schema: {type: string}
          example: passing
        - name: stat
          in: query
          required: true
          description: The stat code to rank by.
          schema: {type: string}
          example: yards
        - name: order
          in: query
          description: "`desc` ranks high values first; `asc` suits low-is-better stats such as ERA."
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: min_games
          in: query
          schema: {type: integer, format: int32, minimum: 0, default: 0}
        - name: qualifier
          in: query
          description: A second stat a player needs at least `qualifier_min` of, such as attempts.
          schema: {type: string}
        - name: qualifier_min
          in: query
          schema: {type: number, format: double, default: 0}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of leaders with their players.
          headers:
            RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
            RateLimit: {$ref: "#/components/headers/RateLimit"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeaderList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/{league}/changes:
    get:
      operationId: listChangedEntities
      tags: [Changes]
      summary: List entities changed in a time window
      description: |
        Which entities of a league changed in [`from`, `window_end`), each once per game with its
        latest version, for clients that refetch rather than stream. A window ends no later than 60
        seconds ago and spans at most 24 hours, so a change is never missed: poll again with
        `from=window_end`. For lower latency, follow a stream's seq instead.
      parameters:
        - {$ref: "#/components/parameters/League"}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Where the window should end. It ends earlier when the limits above say so.
          schema: {type: string, format: date-time}
        - {$ref: "#/components/parameters/Cursor"}
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}
      responses:
        "200":
          description: A page of changed entities, ordered by type, id and game.
          headers:
            RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
            RateLimit: {$ref: "#/components/headers/RateLimit"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangedEntityList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/Unavailable"}
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An API key, sent as `Authorization: Bearer <key>`."
  parameters:
    League:
      name: league
      in: path
      required: true
      description: The league's alias.
      schema: {$ref: "#/components/schemas/LeagueAlias"}
    GameID:
      name: game_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TeamID:
      name: team_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlayerID:
      name: player_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      description: "`next_cursor` from the previous page. Omit it for the first page."
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An `ETag` from an earlier response. When it still matches, the response is 304 with no body.
      schema: {type: string}
  headers:
    ETag:
      description: Identifies this version of the response, for `If-None-Match`.
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer}
    RateLimitPolicy:
      description: |
        Your plan's allowance: `q` requests per period of `w` seconds. See
        [Rate limits](https://statpad.dev/docs/get-started/rate-limits).
      schema: {type: string}
      example: '"allowance";q=500000;w=2592000'
    RateLimit:
      description: |
        Requests left this period after this response (`r`) and seconds until it resets (`t`). See
        [Rate limits](https://statpad.dev/docs/get-started/rate-limits).
      schema: {type: string}
      example: '"allowance";r=499120;t=1723456'
  responses:
    NotModified:
      description: The resource still matches `If-None-Match`.
      headers:
        ETag: {$ref: "#/components/headers/ETag"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
    BadRequest:
      description: A parameter is missing or invalid (`bad_request`).
      headers:
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: The API key is missing, unknown or revoked (`unauthorized`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: The plan doesn't include this league or feature (`forbidden`).
      headers:
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: No such league or entity (`not_found`).
      headers:
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            problemNotFound:
              summary: "An unknown game"
              value: {"type": "https://statpad.dev/docs/errors/not_found", "title": "Not found", "status": 404, "code": "not_found", "detail": "No game 01a1b987-64e7-74e3-8db1-b939d352190d in nfl.", "request_id": "01a1b9878f0a7e21"}
    ResyncRequired:
      description: |
        The requested position is older than the stream's retained history (`resync_required`).
        Fetch the game again and continue from the seq it returns.
      headers:
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            problemResync:
              summary: "A seq older than the retained history"
              value: {"type": "https://statpad.dev/docs/errors/resync_required", "title": "Resync required", "status": 410, "code": "resync_required", "detail": "after_seq 40 is older than the retained history. Fetch the game and continue from its seq.", "min_seq": 1200}
    TooManyRequests:
      description: |
        The account's request rate (`rate_limited`) or period allowance (`quota_exhausted`, with
        `resets_at`) is used up. No data is served.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: Account access or its limits could not be checked because a dependency is unavailable (`unavailable`). No data is served.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: Something failed on our side (`internal`). Retry with backoff.
      headers:
        RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
        RateLimit: {$ref: "#/components/headers/RateLimit"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      description: An RFC 9457 problem detail.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri, description: Identifies the problem type., examples: ["https://statpad.dev/docs/errors/not_found"]}
        title: {type: string, examples: [Not found]}
        status: {type: integer, examples: [404]}
        detail: {type: string, examples: [No game 019a5c3e-7d1a-7b2e-9c40-3f1d2e8a6b10 in nfl.]}
        code: {$ref: "#/components/schemas/ErrorCode"}
        request_id: {type: string}
        min_seq:
          allOf: [{$ref: "#/components/schemas/Seq"}]
          description: With `resync_required`, the oldest seq the stream still holds.
        resets_at: {type: string, format: date-time, description: "With `quota_exhausted`, when the next period's allowance starts."}
    NextCursor:
      type: [string, "null"]
      description: Pass as `cursor` for the next page; null on the last page.
    LeagueList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/League"}}
    GameList:
      type: object
      required: [data, teams, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Game"}}
        teams: {type: array, description: The teams the page's games reference., items: {$ref: "#/components/schemas/Team"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    TeamDetail:
      type: object
      required: [team]
      properties:
        team: {$ref: "#/components/schemas/Team"}
    PlayerDetail:
      type: object
      required: [player]
      properties:
        player: {$ref: "#/components/schemas/Player"}
    GameDetail:
      type: object
      required: [game, live_state, home_team, away_team, venue, period_scores, seq]
      properties:
        game: {$ref: "#/components/schemas/Game"}
        live_state:
          description: Null until the game has live data.
          oneOf:
            - {$ref: "#/components/schemas/LiveState"}
            - {type: "null"}
        home_team: {$ref: "#/components/schemas/Team"}
        away_team: {$ref: "#/components/schemas/Team"}
        venue:
          oneOf:
            - {$ref: "#/components/schemas/Venue"}
            - {type: "null"}
        period_scores: {type: array, items: {$ref: "#/components/schemas/PeriodScore"}}
        seq:
          allOf: [{$ref: "#/components/schemas/Seq"}]
          description: The position in the game's stream this response reflects. Resume a subscription from it.
    PlayList:
      type: object
      required: [data, next_cursor, seq]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Play"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
        seq:
          allOf: [{$ref: "#/components/schemas/Seq"}]
          description: The position in the game's stream this page reflects. When paging, resume the stream from the first page's seq.
    PlayGroupList:
      type: object
      required: [data, next_cursor, seq]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/PlayGroup"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
        seq: {$ref: "#/components/schemas/Seq"}
    BoxScore:
      type: object
      required: [game_id, period_scores, teams, players, seq]
      properties:
        game_id: {type: string, format: uuid}
        period_scores: {type: array, items: {$ref: "#/components/schemas/PeriodScore"}}
        teams: {type: array, items: {$ref: "#/components/schemas/TeamGameStats"}}
        players: {type: array, items: {$ref: "#/components/schemas/PlayerGameStats"}}
        seq: {$ref: "#/components/schemas/Seq"}
    GameRosterList:
      type: object
      required: [data, players, next_cursor, seq]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/GameRosterEntry"}}
        players: {type: array, items: {$ref: "#/components/schemas/Player"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
        seq: {$ref: "#/components/schemas/Seq"}
    ChangeList:
      type: object
      required: [stream, data, head_seq, min_seq]
      properties:
        stream: {$ref: "#/components/schemas/StreamName"}
        data: {type: array, items: {$ref: "#/components/schemas/Change"}}
        head_seq:
          allOf: [{$ref: "#/components/schemas/Seq"}]
          description: The stream's last seq visible to this plan. Fewer changes than `limit` and the last one at `head_seq` means caught up.
        min_seq:
          allOf: [{$ref: "#/components/schemas/Seq"}]
          description: The oldest seq the stream still holds.
    TeamList:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Team"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    RosterList:
      type: object
      required: [data, players, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/RosterEntry"}}
        players: {type: array, items: {$ref: "#/components/schemas/Player"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    DepthChartResponse:
      type: object
      required: [depth_chart, players]
      properties:
        depth_chart: {$ref: "#/components/schemas/DepthChart"}
        players: {type: array, items: {$ref: "#/components/schemas/Player"}}
    PlayerSeasonStatsList:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/PlayerSeasonStats"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    InjuryList:
      type: object
      required: [data, players, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Injury"}}
        players: {type: array, items: {$ref: "#/components/schemas/Player"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    TransactionList:
      type: object
      required: [data, players, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Transaction"}}
        players: {type: array, items: {$ref: "#/components/schemas/Player"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    LeaderList:
      type: object
      required: [data, players, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Leader"}}
        players: {type: array, items: {$ref: "#/components/schemas/Player"}}
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    ChangedEntityList:
      type: object
      required: [data, window_start, window_end, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/ChangedEntity"}}
        window_start: {type: string, format: date-time}
        window_end:
          type: string
          format: date-time
          description: Where this window ended. Poll the next one with `from` set to it.
        next_cursor: {$ref: "#/components/schemas/NextCursor"}
    # ---------------------------------------------------------------- reference data
    League:
      type: object
      description: A league. Its alias is the `league` segment of every REST path.
      required: [id, alias, name, sport, level, period_kind, regulation_periods]
      properties:
        id: {type: string, format: uuid}
        alias: {$ref: "#/components/schemas/LeagueAlias"}
        name: {type: string, examples: [National Football League]}
        sport: {$ref: "#/components/schemas/Sport"}
        level:
          type: string
          enum: [pro, college, minor, international]
        period_kind:
          type: string
          enum: [quarter, half, inning, period]
        regulation_periods: {type: integer, format: int32, examples: [4]}
    LeagueAlias:
      type: string
      description: A league's public alias, such as `nfl` or `ncaaf`.
      pattern: "^[a-z][a-z0-9]*$"
      examples: [nfl]
    Sport:
      type: string
      enum: [football, baseball, hockey, basketball, soccer]
    Season:
      type: object
      description: A league year and phase. `year` is the year the season starts.
      required: [id, league, year, type, name, starts_on, ends_on]
      properties:
        id: {type: string, format: uuid}
        league: {$ref: "#/components/schemas/LeagueAlias"}
        year: {type: integer, format: int32, examples: [2026]}
        type: {$ref: "#/components/schemas/SeasonType"}
        name: {type: string, examples: [2026 REG]}
        starts_on: {type: [string, "null"], format: date}
        ends_on: {type: [string, "null"], format: date}
    SeasonType:
      type: string
      description: Preseason, regular season, postseason, play-in tournament or all-star.
      enum: [PRE, REG, PST, PIT, AST]
    SeasonWeek:
      type: object
      required: [id, season_id, sequence, title, starts_on, ends_on]
      properties:
        id: {type: string, format: uuid}
        season_id: {type: string, format: uuid}
        sequence: {type: integer, format: int32, examples: [10]}
        title: {type: string, examples: [Week 10]}
        starts_on: {type: [string, "null"], format: date}
        ends_on: {type: [string, "null"], format: date}
    Venue:
      type: object
      required: [id, name, city, state, country, timezone, capacity, surface, roof_type, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        city: {type: [string, "null"]}
        state: {type: [string, "null"]}
        country: {type: [string, "null"]}
        timezone: {type: [string, "null"], description: IANA time zone name.}
        capacity: {type: [integer, "null"], format: int32}
        surface: {type: [string, "null"]}
        roof_type:
          oneOf:
            - {$ref: "#/components/schemas/RoofType"}
            - {type: "null"}
        version: {$ref: "#/components/schemas/Version"}
    RoofType:
      type: string
      enum: [outdoor, dome, retractable]
    Team:
      type: object
      required: [id, league, market, name, alias, venue_id, active, version, updated_at]
      properties:
        id: {type: string, format: uuid}
        league: {$ref: "#/components/schemas/LeagueAlias"}
        market: {type: string, examples: [Buffalo]}
        name: {type: string, examples: [Bills]}
        alias:
          type: string
          description: Abbreviation. Two teams in a league can share one, so identify teams by id.
          examples: [BUF]
        venue_id: {type: [string, "null"], format: uuid}
        active: {type: boolean}
        version: {$ref: "#/components/schemas/Version"}
        updated_at: {type: string, format: date-time}
    Player:
      type: object
      description: A person. One id follows a player across leagues, from college to the pros.
      required: [id, first_name, last_name, full_name, abbr_name, birth_date, birth_place, height_in, weight_lb, bats, throws, primary_position, college, rookie_year, draft, version, updated_at]
      properties:
        id: {type: string, format: uuid}
        first_name: {type: string}
        last_name: {type: string}
        full_name: {type: string}
        abbr_name: {type: [string, "null"]}
        birth_date: {type: [string, "null"], format: date}
        birth_place: {type: [string, "null"]}
        height_in: {type: [integer, "null"], format: int32}
        weight_lb: {type: [integer, "null"], format: int32}
        bats:
          oneOf:
            - {$ref: "#/components/schemas/Hand"}
            - {type: "null"}
        throws:
          oneOf:
            - {$ref: "#/components/schemas/Hand"}
            - {type: "null"}
        primary_position: {type: [string, "null"], examples: [QB]}
        college: {type: [string, "null"]}
        rookie_year: {type: [integer, "null"], format: int32}
        draft:
          oneOf:
            - {$ref: "#/components/schemas/Draft"}
            - {type: "null"}
        version: {$ref: "#/components/schemas/Version"}
        updated_at: {type: string, format: date-time}
    Hand:
      type: string
      description: Left, right or switch.
      enum: [L, R, S]
    Draft:
      type: object
      description: What is known of the player's draft. Present when any of its fields is known.
      required: [year, round, pick, team_id]
      properties:
        year: {type: [integer, "null"], format: int32}
        round: {type: [integer, "null"], format: int32}
        pick: {type: [integer, "null"], format: int32}
        team_id: {type: [string, "null"], format: uuid}
    Version:
      type: integer
      format: int32
      minimum: 1
      description: |
        Bumps on every change to the entity, deletions included. A client holding a version can
        ignore any state with a lower one.
    # ---------------------------------------------------------------- games
    Game:
      type: object
      required: [id, league, season_id, week_id, title, game_type, status, coverage, scheduled_at, venue_id, neutral_site, home_team_id, away_team_id, home_score, away_score, attendance, started_at, ended_at, rescheduled_from_id, version, updated_at]
      properties:
        id: {type: string, format: uuid}
        league: {$ref: "#/components/schemas/LeagueAlias"}
        season_id: {type: string, format: uuid}
        week_id: {type: [string, "null"], format: uuid}
        title: {type: [string, "null"], description: "A named game's title, such as a bowl."}
        game_type:
          type: string
          enum: [regular, playoff, preseason, exhibition, allstar]
        status: {$ref: "#/components/schemas/GameStatus"}
        coverage:
          type: string
          description: How much the feed covers. `full` has play-by-play; `score_only` has the score alone.
          enum: [full, basic, score_only]
        scheduled_at:
          type: string
          format: date-time
          description: |
            When the game starts. For a `time_tbd` game it is the start of the game's US Eastern
            day, not a start time, and a game whose date isn't fixed yet, such as an NFL flex game,
            can still move to another day.
        venue_id: {type: [string, "null"], format: uuid}
        neutral_site: {type: boolean}
        home_team_id: {type: string, format: uuid}
        away_team_id: {type: string, format: uuid}
        home_score: {type: [integer, "null"], format: int32}
        away_score: {type: [integer, "null"], format: int32}
        attendance: {type: [integer, "null"], format: int32}
        started_at: {type: [string, "null"], format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        rescheduled_from_id:
          type: [string, "null"]
          format: uuid
          description: For a makeup game, the postponed game it replaces, when known.
        version: {$ref: "#/components/schemas/Version"}
        updated_at: {type: string, format: date-time}
    GameStatus:
      type: string
      description: |
        `scheduled`, then `created` (data available), `inprogress` (with `halftime` and
        `delayed` along the way), `complete` (final, stats may still be corrected) and `closed`
        (validated). Also `time_tbd`, `suspended`, `postponed` and `cancelled`. Depending on the
        league, a postponed game either goes back to `scheduled` at its new time under the same id,
        or stays `postponed` while its makeup is a new game.
      enum: [scheduled, time_tbd, created, inprogress, halftime, delayed, suspended, complete, closed, postponed, cancelled]
    LiveState:
      type: object
      description: |
        The live situation of a game, keyed by `game_id`. Sport-specific context is in the block
        named after the league's sport; the others are null.
      required: [game_id, period, period_half, clock_seconds, clock_running, possession_team_id, home_score, away_score, last_play_id, football, soccer, basketball, version, updated_at]
      properties:
        game_id: {type: string, format: uuid}
        period: {type: [integer, "null"], format: int32}
        period_half: {oneOf: [{$ref: "#/components/schemas/PeriodHalf"}, {type: "null"}]}
        clock_seconds: {type: [integer, "null"], format: int32}
        clock_running: {type: boolean}
        possession_team_id: {type: [string, "null"], format: uuid}
        home_score: {type: integer, format: int32}
        away_score: {type: integer, format: int32}
        last_play_id: {type: [string, "null"], format: uuid}
        football:
          oneOf:
            - {$ref: "#/components/schemas/FootballSituation"}
            - {type: "null"}
        soccer:
          oneOf:
            - {$ref: "#/components/schemas/SoccerSituation"}
            - {type: "null"}
        basketball:
          oneOf:
            - {$ref: "#/components/schemas/BasketballSituation"}
            - {type: "null"}
        version: {$ref: "#/components/schemas/Version"}
        updated_at: {type: string, format: date-time}
    PeriodHalf:
      type: string
      description: Top or bottom of an inning. Other sports have no halves, so the field is null.
      enum: [top, bottom]
    FootballSituation:
      type: object
      required: [down, yards_to_go, yardline, home_timeouts, away_timeouts]
      properties:
        down: {type: [integer, "null"], format: int32, minimum: 1, maximum: 4}
        yards_to_go: {type: [integer, "null"], format: int32}
        yardline:
          type: [integer, "null"]
          format: int32
          description: Line of scrimmage, 0-100 from the possessing team's own goal line.
        home_timeouts: {type: integer, format: int32}
        away_timeouts: {type: integer, format: int32}
    SoccerSituation:
      type: object
      description: |
        The live soccer context. Periods 1 and 2 are the halves, 3 and 4 the halves of extra time and
        5 the penalty shoot-out. `minute` and `added_minute` are the clock as shown, so 90'+6' is minute
        90 and added minute 6.
      required: [minute, added_minute, added_time_announced, home_formation, away_formation, home_red_cards, away_red_cards, home_shootout, away_shootout]
      properties:
        minute: {type: [integer, "null"], format: int32, examples: [90]}
        added_minute: {type: [integer, "null"], format: int32, examples: [6]}
        added_time_announced:
          type: [integer, "null"]
          format: int32
          description: Minutes of stoppage time the fourth official announced for the current period.
        home_formation: {type: [string, "null"], examples: [4-2-3-1]}
        away_formation: {type: [string, "null"], examples: [4-3-3]}
        home_red_cards: {type: integer, format: int32}
        away_red_cards: {type: integer, format: int32}
        home_shootout: {type: [integer, "null"], format: int32, description: Penalties scored in a shoot-out.}
        away_shootout: {type: [integer, "null"], format: int32, description: Penalties scored in a shoot-out.}
    BasketballSituation:
      type: object
      description: |
        The live basketball context. NBA periods 1-4 are quarters and NCAA periods 1-2 halves; every later
        period is a 5-minute overtime. Each count is null when the provider doesn't report it.
      required: [home_timeouts, away_timeouts, home_fouls, away_fouls]
      properties:
        home_timeouts: {type: [integer, "null"], format: int32, description: Timeouts the home team has left.}
        away_timeouts: {type: [integer, "null"], format: int32, description: Timeouts the away team has left.}
        home_fouls: {type: [integer, "null"], format: int32, description: The home team's fouls in the current period.}
        away_fouls: {type: [integer, "null"], format: int32, description: The away team's fouls in the current period.}
    PeriodScore:
      type: object
      required: [team_id, period, period_type, points]
      properties:
        team_id: {type: string, format: uuid}
        period: {type: integer, format: int32}
        period_type:
          type: string
          enum: [regular, overtime, shootout]
        points: {type: integer, format: int32}
    GameRosterEntry:
      type: object
      description: A player dressed for one game, with the team, jersey and position for that game.
      required: [game_id, player_id, team_id, status, starter, position, jersey, version]
      properties:
        game_id: {type: string, format: uuid}
        player_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        status:
          type: string
          enum: [active, inactive, did_not_play, ejected]
        starter: {type: boolean}
        position: {type: [string, "null"]}
        jersey: {type: [string, "null"]}
        version: {$ref: "#/components/schemas/Version"}
    # ---------------------------------------------------------------- play-by-play
    PlayGroup:
      type: object
      description: |
        A drive (football), an at-bat (baseball) or a possession. Ordered by `sequence`, which a
        provider can renumber, so identify groups by id.
      required: [id, game_id, kind, sequence, period, period_half, team_id, result, football, version, updated_at]
      properties:
        id: {type: string, format: uuid}
        game_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [drive, at_bat, possession]
        sequence: {type: integer, format: int32}
        period: {type: integer, format: int32}
        period_half: {oneOf: [{$ref: "#/components/schemas/PeriodHalf"}, {type: "null"}]}
        team_id: {type: [string, "null"], format: uuid, description: The team with the ball or at bat.}
        result: {type: [string, "null"], examples: [Touchdown]}
        football:
          oneOf:
            - {$ref: "#/components/schemas/FootballDrive"}
            - {type: "null"}
        version: {$ref: "#/components/schemas/Version"}
        updated_at: {type: string, format: date-time}
    FootballDrive:
      type: object
      required: [start_clock, end_clock, start_yardline, end_yardline, play_count, yards, first_downs, duration_seconds, points]
      properties:
        start_clock: {type: [integer, "null"], format: int32}
        end_clock: {type: [integer, "null"], format: int32}
        start_yardline: {type: [integer, "null"], format: int32, minimum: 0, maximum: 100}
        end_yardline: {type: [integer, "null"], format: int32, minimum: 0, maximum: 100}
        play_count: {type: [integer, "null"], format: int32}
        yards: {type: [integer, "null"], format: int32}
        first_downs: {type: [integer, "null"], format: int32}
        duration_seconds: {type: [integer, "null"], format: int32}
        points: {type: [integer, "null"], format: int32}
    Play:
      type: object
      description: |
        One event in a game. `sequence` is the provider's total order within the game; two plays
        can share it, so order by (`sequence`, `id`). Corrections bump `version`.
      required: [id, game_id, group_id, sequence, period, period_half, clock_seconds, wall_clock, type, description, team_id, is_scoring, points, home_score, away_score, is_official, participants, football, soccer, basketball, version, updated_at]
      properties:
        id: {type: string, format: uuid}
        game_id: {type: string, format: uuid}
        group_id: {type: [string, "null"], format: uuid}
        sequence: {type: integer, format: int64}
        period: {type: integer, format: int32}
        period_half: {oneOf: [{$ref: "#/components/schemas/PeriodHalf"}, {type: "null"}]}
        clock_seconds: {type: [integer, "null"], format: int32}
        wall_clock: {type: [string, "null"], format: date-time}
        type:
          type: string
          description: |
            The play's type in its sport's vocabulary. Football uses the FootballPlayType values, soccer the
            SoccerPlayType values and basketball the BasketballPlayType values.
          examples: [pass]
        description: {type: [string, "null"]}
        team_id:
          type: [string, "null"]
          format: uuid
          description: |
            The team with the ball or at bat; in soccer and basketball, the team credited with the event, which
            for a shot is the shooting team.
        is_scoring: {type: boolean}
        points: {type: [integer, "null"], format: int32}
        home_score: {type: [integer, "null"], format: int32, description: Score after the play.}
        away_score: {type: [integer, "null"], format: int32, description: Score after the play.}
        is_official: {type: boolean}
        participants:
          type: array
          items: {$ref: "#/components/schemas/Participant"}
        football:
          oneOf:
            - {$ref: "#/components/schemas/FootballPlay"}
            - {type: "null"}
        soccer:
          oneOf:
            - {$ref: "#/components/schemas/SoccerPlay"}
            - {type: "null"}
        basketball:
          oneOf:
            - {$ref: "#/components/schemas/BasketballPlay"}
            - {type: "null"}
        version: {$ref: "#/components/schemas/Version"}
        updated_at: {type: string, format: date-time}
    Participant:
      type: object
      required: [player_id, team_id, role]
      properties:
        player_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        role: {type: string, examples: [passer]}
    FootballPlay:
      type: object
      required: [play_type, down, yards_to_go, start_yardline, end_yardline, yards_gained, is_first_down, is_touchdown, is_turnover, is_penalty, play_action, screen_pass, run_pass_option, air_yards, penalty_yards]
      properties:
        play_type: {$ref: "#/components/schemas/FootballPlayType"}
        down: {type: [integer, "null"], format: int32, minimum: 1, maximum: 4}
        yards_to_go: {type: [integer, "null"], format: int32}
        start_yardline: {type: [integer, "null"], format: int32, minimum: 0, maximum: 100}
        end_yardline: {type: [integer, "null"], format: int32, minimum: 0, maximum: 100}
        yards_gained: {type: [integer, "null"], format: int32}
        is_first_down: {type: boolean}
        is_touchdown: {type: boolean}
        is_turnover: {type: boolean}
        is_penalty: {type: boolean}
        play_action: {type: [boolean, "null"]}
        screen_pass: {type: [boolean, "null"]}
        run_pass_option: {type: [boolean, "null"]}
        air_yards: {type: [integer, "null"], format: int32}
        penalty_yards:
          type: [integer, "null"]
          format: int32
          description: |
            Net yards penalties moved the ball, for (+) or against (-) the offense, so that
            start_yardline + yards_gained + penalty_yards = end_yardline. Null without a penalty.
    FootballPlayType:
      type: string
      enum: [pass, rush, punt, kickoff, field_goal, extra_point, two_point, penalty, kneel, spike, timeout, other]
    SoccerPlay:
      type: object
      description: |
        A soccer event. Positions run 0-100 from the acting team's view: x from its own goal line to the
        one it attacks, y across the pitch. A shoot-out kick has `is_shootout` set, is in period 5 and
        never counts toward the score.
      required: [play_type, minute, added_minute, is_shootout, body_part, field_x, field_y, end_x, end_y]
      properties:
        play_type: {$ref: "#/components/schemas/SoccerPlayType"}
        minute: {type: [integer, "null"], format: int32, description: The match minute shown for the event., examples: [90]}
        added_minute: {type: [integer, "null"], format: int32, description: The stoppage minute after it., examples: [6]}
        is_shootout: {type: boolean}
        body_part:
          oneOf:
            - {$ref: "#/components/schemas/SoccerBodyPart"}
            - {type: "null"}
        field_x: {type: [number, "null"], format: float, description: Where the event happened.}
        field_y: {type: [number, "null"], format: float}
        end_x: {type: [number, "null"], format: float, description: Where a shot ended.}
        end_y: {type: [number, "null"], format: float}
    SoccerPlayType:
      type: string
      enum: [goal, own_goal, penalty_goal, penalty_missed, penalty_saved, shot_on_target, shot_off_target, shot_blocked, shot_woodwork, foul, handball, offside, corner, yellow_card, red_card, substitution, var_decision, goal_disallowed, delay_start, delay_end, period_start, period_end, other]
    SoccerBodyPart:
      type: string
      enum: [left_foot, right_foot, head, other]
    BasketballPlay:
      type: object
      description: |
        A basketball event. A shot is worth `points_attempted` (1 for a free throw, 2 or 3 for a field goal, 0 for
        anything else) and `is_made` says whether it went in. Court positions are in feet: x across the court
        from 0 to 50, y along it from the basket attacked, negative behind the basket.
      required: [play_type, shot_type, points_attempted, is_made, free_throw, free_throws, court_x, court_y]
      properties:
        play_type: {$ref: "#/components/schemas/BasketballPlayType"}
        shot_type:
          oneOf:
            - {$ref: "#/components/schemas/BasketballShotType"}
            - {type: "null"}
        points_attempted: {type: integer, format: int32, minimum: 0, maximum: 3}
        is_made: {type: boolean}
        free_throw: {type: [integer, "null"], format: int32, description: "A free throw's place in its trip to the line, 2 in 2 of 2.", examples: [2]}
        free_throws: {type: [integer, "null"], format: int32, description: Free throws in the trip., examples: [2]}
        court_x: {type: [integer, "null"], format: int32, minimum: 0, maximum: 50}
        court_y: {type: [integer, "null"], format: int32, minimum: -5, maximum: 89}
    BasketballPlayType:
      type: string
      enum: [field_goal, free_throw, offensive_rebound, defensive_rebound, rebound, turnover, steal, block, foul, technical_foul, flagrant_foul, violation, timeout, substitution, jump_ball, review, ejection, period_start, period_end, game_end, other]
    BasketballShotType:
      type: string
      enum: [jump_shot, layup, dunk, hook_shot, tip_shot]
    # ---------------------------------------------------------------- statistics
    StatLine:
      type: object
      description: |
        Stat values keyed by stat code (`yards`, `att`, `td`). Values are numbers, except stats
        whose definition says text.
      additionalProperties: {type: [number, string]}
      x-go-type: json.RawMessage
      examples:
        - {att: 31, cmp: 22, yards: 248, td: 2, int: 0}
    StatsByCategory:
      type: object
      description: Stat lines keyed by category (`passing`, `rushing`, `defense`).
      additionalProperties: {$ref: "#/components/schemas/StatLine"}
    PlayerGameStats:
      type: object
      description: One player's stats in one game, every category together.
      required: [game_id, player_id, team_id, stats, version]
      properties:
        game_id: {type: string, format: uuid}
        player_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        stats: {$ref: "#/components/schemas/StatsByCategory"}
        version: {$ref: "#/components/schemas/Version"}
    TeamGameStats:
      type: object
      required: [game_id, team_id, stats, version]
      properties:
        game_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        stats: {$ref: "#/components/schemas/StatsByCategory"}
        version: {$ref: "#/components/schemas/Version"}
    PlayerSeasonStats:
      type: object
      description: A player's totals for one season and category. `team_id` null is the total across teams.
      required: [season_id, player_id, team_id, category, games, stats]
      properties:
        season_id: {type: string, format: uuid}
        player_id: {type: string, format: uuid}
        team_id: {type: [string, "null"], format: uuid}
        category: {type: string, examples: [passing]}
        games: {type: integer, format: int32}
        stats: {$ref: "#/components/schemas/StatLine"}
    Leader:
      type: object
      required: [player_id, value]
      properties:
        player_id: {type: string, format: uuid}
        value: {type: number, format: double}
    # ---------------------------------------------------------------- league data
    RosterEntry:
      type: object
      description: A stint of a player on a team. `ended_on` is the last day, null while current.
      required: [id, league, player_id, team_id, status, position, jersey, started_on, ended_on]
      properties:
        id: {type: string, format: uuid}
        league: {$ref: "#/components/schemas/LeagueAlias"}
        player_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        status:
          type: string
          enum: [active, injured_reserve, practice_squad, suspended, reserve, pup, nfi, injured_list, minors, restricted, redshirt]
        position: {type: [string, "null"]}
        jersey: {type: [string, "null"]}
        started_on: {type: string, format: date}
        ended_on: {type: [string, "null"], format: date}
    DepthChart:
      type: object
      description: A team's depth chart as of `effective_at`. Each one replaces the previous chart whole.
      required: [id, team_id, season_id, week_id, effective_at, entries]
      properties:
        id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        season_id: {type: string, format: uuid}
        week_id: {type: [string, "null"], format: uuid}
        effective_at: {type: string, format: date-time}
        entries:
          type: array
          items: {$ref: "#/components/schemas/DepthChartEntry"}
    DepthChartEntry:
      type: object
      required: [unit, position, depth, player_id]
      properties:
        unit:
          type: string
          enum: [offense, defense, special_teams, lineup, rotation, bullpen]
        position: {type: string, examples: [LWR]}
        depth: {type: integer, format: int32, minimum: 1, description: 1 is the starter.}
        player_id: {type: string, format: uuid}
    Injury:
      type: object
      description: One injury episode with its latest report. Reports are kept as history; this is the current one.
      required: [id, league, player_id, team_id, body_part, detail, side, started_on, resolved_on, estimated_return, status, practice_status, reported_at, comment]
      properties:
        id: {type: string, format: uuid}
        league: {$ref: "#/components/schemas/LeagueAlias"}
        player_id: {type: string, format: uuid}
        team_id: {type: [string, "null"], format: uuid}
        body_part: {type: [string, "null"], examples: [Knee]}
        detail: {type: [string, "null"]}
        side:
          oneOf:
            - {$ref: "#/components/schemas/InjurySide"}
            - {type: "null"}
        started_on: {type: [string, "null"], format: date}
        resolved_on: {type: [string, "null"], format: date}
        estimated_return: {type: [string, "null"], format: date}
        status:
          description: Game designation from the latest report.
          oneOf:
            - {$ref: "#/components/schemas/InjuryStatus"}
            - {type: "null"}
        practice_status:
          oneOf:
            - {$ref: "#/components/schemas/PracticeStatus"}
            - {type: "null"}
        reported_at: {type: [string, "null"], format: date-time}
        comment: {type: [string, "null"]}
    InjurySide:
      type: string
      enum: [left, right, both]
    InjuryStatus:
      type: string
      enum: [probable, questionable, doubtful, out, day_to_day, injured_reserve, il_7, il_10, il_15, il_60, season_ending]
    PracticeStatus:
      type: string
      enum: [full, limited, did_not_participate, not_listed]
    Transaction:
      type: object
      required: [id, league, player_id, from_team_id, to_team_id, type, description, effective_on, announced_at]
      properties:
        id: {type: string, format: uuid}
        league: {$ref: "#/components/schemas/LeagueAlias"}
        player_id: {type: [string, "null"], format: uuid}
        from_team_id: {type: [string, "null"], format: uuid}
        to_team_id: {type: [string, "null"], format: uuid}
        type: {type: string, examples: [signed]}
        description: {type: string}
        effective_on: {type: string, format: date}
        announced_at: {type: string, format: date-time}
    # ---------------------------------------------------------------- change journal
    EntityType:
      type: string
      description: |
        The kind of entity a change carries, which fixes the payload schema: `game` Game,
        `live_state` LiveState, `team` Team, `venue` Venue, `season` Season, `season_week`
        SeasonWeek, `player` Player, `game_roster` GameRosterEntry, `play_group` PlayGroup,
        `play` Play, `player_game_stats` PlayerGameStats, `team_game_stats` TeamGameStats,
        `injury` Injury, `transaction` Transaction, `roster` RosterEntry and `depth_chart`
        DepthChart. A deletion's payload is a Tombstone.
      enum: [game, live_state, team, venue, season, season_week, player, game_roster, play_group, play, player_game_stats, team_game_stats, injury, transaction, roster, depth_chart]
    Op:
      type: string
      description: "`upsert` carries the entity's full current state, so replace what you hold by id. `delete` removes it."
      enum: [upsert, delete]
    Tombstone:
      type: object
      description: The payload of a deletion.
      required: [id, version, deleted_at]
      properties:
        id: {type: string, format: uuid}
        version: {$ref: "#/components/schemas/Version"}
        deleted_at: {type: string, format: date-time}
    EntityPayload:
      description: The entity's DTO, chosen by `entity_type`, or a Tombstone when `op` is `delete`.
      anyOf:
        - {$ref: "#/components/schemas/Game"}
        - {$ref: "#/components/schemas/LiveState"}
        - {$ref: "#/components/schemas/Team"}
        - {$ref: "#/components/schemas/Venue"}
        - {$ref: "#/components/schemas/Season"}
        - {$ref: "#/components/schemas/SeasonWeek"}
        - {$ref: "#/components/schemas/Player"}
        - {$ref: "#/components/schemas/GameRosterEntry"}
        - {$ref: "#/components/schemas/PlayGroup"}
        - {$ref: "#/components/schemas/Play"}
        - {$ref: "#/components/schemas/PlayerGameStats"}
        - {$ref: "#/components/schemas/TeamGameStats"}
        - {$ref: "#/components/schemas/Injury"}
        - {$ref: "#/components/schemas/Transaction"}
        - {$ref: "#/components/schemas/RosterEntry"}
        - {$ref: "#/components/schemas/DepthChart"}
        - {$ref: "#/components/schemas/Tombstone"}
      x-go-type: json.RawMessage
    Change:
      type: object
      description: |
        One entry of a stream's journal. `seq` is gapless and in commit order within the stream,
        so a client that has applied seq N has applied everything before it.
      required: [seq, at, op, entity_type, entity_id, version, payload_version, payload]
      properties:
        seq: {$ref: "#/components/schemas/Seq"}
        at: {type: string, format: date-time, description: When the change was recorded.}
        op: {$ref: "#/components/schemas/Op"}
        entity_type: {$ref: "#/components/schemas/EntityType"}
        entity_id:
          type: string
          format: uuid
          description: The entity's id. For `game_roster` and `player_game_stats` it is the player's id.
        version: {$ref: "#/components/schemas/Version"}
        payload_version:
          type: integer
          format: int32
          description: The payload schema version. This document describes version 1.
          examples: [1]
        payload: {$ref: "#/components/schemas/EntityPayload"}
    Seq:
      type: integer
      format: int64
      minimum: 0
      description: A position in a stream. 0 is before the first change.
    StreamName:
      type: string
      description: |
        `game:<game id>` carries one game: the game, its live state, game roster, play groups, plays
        and stats. `league:<alias>` carries the league's shared data: teams, players, venues,
        seasons and weeks, plus rosters, injuries, transactions and depth charts.
      pattern: "^(game:[0-9a-f-]{36}|league:[a-z][a-z0-9]*)$"
      examples: ["game:019a5c3e-7d1a-7b2e-9c40-3f1d2e8a6b10", "league:nfl"]
    ChangedEntity:
      type: object
      description: |
        An entity that changed, once per game it changed in. A game-scoped entity such as a
        game roster entry or game stats is keyed by the player or team, so `game_id` says which
        game's entity changed.
      required: [entity_type, entity_id, game_id, version, last_modified]
      properties:
        entity_type: {$ref: "#/components/schemas/EntityType"}
        entity_id: {type: string, format: uuid}
        game_id:
          type: [string, "null"]
          format: uuid
          description: The game whose stream recorded the change, or null for a league-stream entity.
        version: {$ref: "#/components/schemas/Version"}
        last_modified: {type: string, format: date-time}
    # ---------------------------------------------------------------- errors
    ErrorCode:
      type: string
      description: |
        `bad_request` a malformed request or message. `unauthorized` a missing or invalid API key.
        `forbidden` the plan doesn't include the league or feature. `not_found`. `rate_limited`.
        `resync_required` the requested position is older than the retained history, so subscribe
        again without `resume` for a fresh snapshot (for a game stream, a REST game read with its
        `seq` also works). `invalid_resume` a resume
        seq beyond the stream's head. `slow_consumer` the client fell too far behind and was
        dropped from a stream, so resume from `resume_from`. `too_many_subscriptions`.
        `unknown_stream`. `internal`. `unavailable`. `quota_exhausted` the account has used its
        request allowance for the current period.
      enum: [bad_request, unauthorized, forbidden, not_found, rate_limited, resync_required, invalid_resume, slow_consumer, too_many_subscriptions, unknown_stream, internal, unavailable, quota_exhausted]
