openapi: 3.1.0
info:
  title: Statpad API
  version: 1.0.0
  summary: Live sports data over REST.
  description: |
    Live and historical sports data: schedules, games with live state, play-by-play, box scores,
    players, rosters, depth charts, injuries, transactions and season leaders. The WebSocket
    stream (asyncapi.yaml) pushes the same entities as they change.

    **Entities.** Every entity in a response is a public DTO from schemas.yaml, the same shape a
    stream message carries. They reference each other by id; list responses add the teams or
    players they reference alongside the page, so one request is enough to render it.

    **Pagination.** Lists are cursor-paginated, except the game changes feed, which is the
    journal itself and pages by `after_seq`. Pass `next_cursor` back as `cursor` until it is
    null. Cursors are opaque and stay valid indefinitely. Each page is read when it is requested,
    so an entity that changes while you page can move across a page boundary. Game-scoped lists
    return `seq`: to stay exact, resume `game:<id>` from the first page's seq. Replaying a change
    you already have is harmless, because every change carries the entity's full state and
    version. Other cursor-paged lists carry no seq and are current as of each page's read.

    **Catching up live.** Game reads return `seq`, the position in the game's stream that the
    response reflects. Subscribe to `game:<id>` with that seq as the resume point to receive
    exactly the changes after the response, with nothing missed and nothing repeated. Teams,
    players and venues are shared by many games, so their changes arrive on `league:<alias>`.

    **Caching.** Responses that carry an `ETag` answer a matching `If-None-Match` with 304.

    **Errors** are RFC 9457 problem details (`application/problem+json`) with a stable `code`.

    **Limits.** An account's keys share one request rate and one allowance per monthly period,
    across every server. The rate is a token bucket: the plan's burst can be sent at once, and it
    refills at the plan's sustained rate. A request beyond it gets 429 `rate_limited`, and past
    the period allowance 429 `quota_exhausted` with `resets_at`; both carry `Retry-After` in
    seconds and return no data. Only `2xx` and `304` responses use the allowance: errors,
    including `403`, `404` and `429`, don't. If the limits can't be checked, the request gets 503
    `unavailable` rather than being served unmetered.

    **Usage headers.** Every metered response, 429s included, reports the period allowance in
    the `RateLimit-Policy` and `RateLimit` fields of
    [draft-ietf-httpapi-ratelimit-headers-11](https://datatracker.ietf.org/doc/html/draft-ietf-httpapi-ratelimit-headers-11):
    `RateLimit-Policy: "allowance";q=500000;w=2592000` is the allowance and the period's
    length in seconds, and `RateLimit: "allowance";r=499120;t=1723456` is the requests left
    after this response and the seconds until the period renews. The token bucket isn't
    reported; pace with the plan's published rate and back off on `Retry-After`. The
    [Rate limits](https://statpad.dev/docs/get-started/rate-limits) guide covers both headers in full.
