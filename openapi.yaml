  /v1/{league}/games/{game_id}/changes:
    get:
      operationId: listGameChanges
      tags: [Changes]
      summary: Read a game's change stream
      description: |
        Up to `limit` of the changes the stream `game:<id>` carries after `after_seq`, oldest first.
        Poll it with the last seq you applied. Changes stay readable for at least 7 days after the
        game ends.

        - An `after_seq` older than `min_seq` - 1 returns 410 `resync_required`. Read the game and
          continue from its `seq`.
        - An `after_seq` past `head_seq` returns 400 `bad_request`.
      parameters:
        - {$ref: "#/components/parameters/League"}
        - {$ref: "#/components/parameters/GameID"}
        - name: after_seq
          in: query
          required: true
          description: The last seq the client applied, or 0 for the start.
          schema: {$ref: "#/components/schemas/Seq"}
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: The next changes, and where the stream stands.
          headers:
            RateLimit-Policy: {$ref: "#/components/headers/RateLimitPolicy"}
            RateLimit: {$ref: "#/components/headers/RateLimit"}
          content:
