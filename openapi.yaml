openapi: 3.1.0
info:
  title: Statpad API
  version: 1.0.0
  summary: Live sports data over REST.
  description: |
    Live and historical sports data: schedules, games with live state, play-by-play, box scores,
    players, rosters, depth charts, injuries, transactions and season leaders. The WebSocket
    stream pushes the same entities as they change.

    **Entities.** Every entity has the same JSON here and on the stream. Entities reference each
    other by id, and a list response adds the teams or players its page references.

    **Conventions.** IDs are UUIDv7 strings. Times are RFC 3339 in UTC, and dates are
    `YYYY-MM-DD`. Every field is present, with null where the value is unknown.

    **Compatibility.** Fields are only ever added, and enums only gain values, so ignore fields
    and values you don't know. The stream and the changes feed replay an old change as it was
    stored, without fields added after it. Treat a missing field as null.

    **Pagination.** Pass `next_cursor` back as `cursor` until it's null. Cursors don't expire.
    Each page is read when you request it, so an entity that changes while you page can move
    between pages.

    **Catching up live.** Game reads return `seq`, the position in the game's stream that the
    response reflects. Subscribe to `game:<id>` with that seq as the resume point to get every
    change after the response, with none missing and none repeated.

    **Caching.** The endpoints that accept `If-None-Match` return an `ETag`. A match returns 304
    with no body. A 304 still counts as one request.

    **Errors** are RFC 9457 problem details, sent as `application/problem+json`, with a stable `code`.
    [Errors](https://statpad.dev/docs/errors) explains each code.

    **Limits.** An account's keys share one request rate and one monthly allowance. See
    [Rate limits](https://statpad.dev/docs/get-started/rate-limits) for each plan's limits.

    **Usage headers.** Every metered response reports the allowance in `RateLimit-Policy` and
    `RateLimit`. [Rate limits](https://statpad.dev/docs/get-started/rate-limits#usage-headers)
    explains both.
