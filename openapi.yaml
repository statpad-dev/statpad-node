  - url: https://api.statpad.dev
    description: Production.
security:
  - apiKey: []
tags:
  - name: Leagues
    description: The leagues the API covers.
  - name: Games
    description: Schedules, games with their live state, and who dressed.
  - name: Play-by-play
    description: Plays and the drives or at-bats that group them.
  - name: Statistics
    description: Box scores, season totals and leaders.
  - name: Teams
    description: Teams, rosters and depth charts.
  - name: Players
    description: Player profiles and stats.
  - name: League news
    description: Injuries and transactions.
  - name: Changes
    description: What changed, for clients that poll instead of streaming.
